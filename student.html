            btn.textContent = '✅';
            btn.classList.add('copied');
            showToast('تم نسخ الكود');
            setTimeout(() => { btn.textContent = '📋'; btn.classList.remove('copied'); }, 1800);
        };
        if (navigator.clipboard && window.isSecureContext){
            navigator.clipboard.writeText(code).then(done).catch(() => showToast('تعذر نسخ الكود'));
        } else {
            const temp = document.createElement('textarea');
            temp.value = code;
            temp.style.position = 'fixed'; temp.style.opacity = '0';
            document.body.appendChild(temp);
            temp.select();
            try { document.execCommand('copy'); done(); }
            catch(e){ showToast('تعذر نسخ الكود'); }
            document.body.removeChild(temp);
        }
    }

    const STATUS_INFO = {
        waiting:     { icon: '⏳', label: 'قيد الانتظار', meta: 'طلبك لسه في قائمة الانتظار وهيتراجع قريب.' },
        accepted:    { icon: '🆕', label: 'الطلب جديد', meta: 'طلبك اتقبل، لسه ماحدش بدأ الشغل فيه، هنبدأ قريب.' },
        in_progress: { icon: '🔧', label: 'قيد العمل', meta: 'شغالين على طلبك دلوقتي.' },
        completed:   { icon: '🎉', label: 'اكتمل', meta: 'طلبك خلص خالص وتم تسليمه، تواصل معانا لو محتاج حاجة.' },
        rejected:    { icon: '❌', label: 'تم رفض الطلب', meta: 'للأسف الطلب ده اتحط مرفوض، تواصل معانا لو عندك استفسار.' },
        cancelled:   { icon: '⚪', label: 'تم إلغاء الطلب', meta: 'الطلب ده ملغي.' }
    };

    // Status labels for invoices (auto-generated codes that start with STP-2026-...)
    const INVOICE_STATUS_INFO = {
        new:       { icon: '🆕', label: 'الفاتورة جديدة', meta: 'طلبك اتقبل وبقى فاتورة، لسه ماحدش بدأ الشغل فيه، هنبدأ قريب.' },
        pending:   { icon: '🔧', label: 'قيد العمل', meta: 'شغالين على طلبك دلوقتي.' },
        finished:  { icon: '🎉', label: 'اكتمل', meta: 'طلبك خلص خالص، تواصل معانا لو محتاج حاجة.' },
        delivered: { icon: '📦', label: 'تم التسليم', meta: 'طلبك اتسلم، تواصل معانا لو محتاج حاجة.' }
    };

    // --- Visual status stepper -----------------------------------------------------
    const ORDER_STEPS = [
        { key: 'waiting', label: 'قيد الانتظار' },
        { key: 'accepted', label: 'تم القبول' },
        { key: 'in_progress', label: 'قيد العمل' },
        { key: 'completed', label: 'مكتمل' }
    ];
    const INVOICE_STEPS = [
        { key: 'new', label: 'جديدة' },
        { key: 'pending', label: 'قيد العمل' },
        { key: 'finished', label: 'مكتمل' },
        { key: 'delivered', label: 'تم التسليم' }
    ];
    function renderStepper(steps, currentStatus){
        if (currentStatus === 'rejected' || currentStatus === 'cancelled'){
            return `<div class="stepper-stopped">
                <div class="stepper-stopped-msg">${currentStatus === 'rejected' ? '❌ تم رفض الطلب' : '⚪ تم إلغاء الطلب'}</div>
            </div>`;
        }
        const idx = steps.findIndex(s => s.key === currentStatus);
        const activeIdx = idx === -1 ? 0 : idx;
        return `
            <div class="stepper">
                ${steps.map((s, i) => `
                    <div class="stepper-step ${i < activeIdx ? 'done' : ''} ${i === activeIdx ? 'active' : ''}">
                        <div class="stepper-dot">${i < activeIdx ? '✓' : i + 1}</div>
                        <div class="stepper-label">${s.label}</div>
                    </div>
                    ${i < steps.length - 1 ? `<div class="stepper-line ${i < activeIdx ? 'done' : ''}"></div>` : ''}
                `).join('')}
            </div>`;
    }

    // Renders an order document (matched by its STU-P-... code) into the result box.
    // Checks the order's own delivered-file link first; if that's empty but the order
    // was converted into an invoice (invoiceId), falls back to that invoice's link too —
    // so it doesn't matter which of the two places the admin set the link on.
    async function renderOrderResult(resultBox, o, verified, allowReceive){
        const info = STATUS_INFO[o.status] || { icon: '❔', label: o.status || 'غير معروف', meta: '' };
        let deliveredFileUrl = o.deliveredFileUrl || '';
        if (!deliveredFileUrl && o.status === 'completed' && o.invoiceId){
            try{
                const invDoc = await db.collection('invoices').doc(o.invoiceId).get();
                if (invDoc.exists) deliveredFileUrl = invDoc.data().deliveredFileUrl || '';
            }catch(e){ console.error(e); }
        }
        // In pure "استعلام" (inquiry) mode allowReceive is false, so no receive/download
        // section shows at all — the student only sees the status stepper.
        const canDownload = allowReceive !== false && o.status === 'completed' && deliveredFileUrl;
        // Identity was already confirmed (name/level/university) and the phone verified
        // one step earlier in renderIdentityGate/showPhoneVerifyStep, so the download
        // button can show directly here. The old inline phone-gate only kicks in as a
        // fallback if this got called without going through that flow.
        resultBox.innerHTML = `
            <div class="status-result ${escapeAttr(o.status)}">
                <div class="s-icon">${info.icon}</div>
                <div class="s-label">${info.label}</div>
                ${renderStepper(ORDER_STEPS, o.status)}
                <div class="s-meta">${escapeAttr(o.service) || ''}${o.service ? ' — ' : ''}${info.meta}</div>
                ${canDownload ? (verified ? renderReceiveButton(deliveredFileUrl, o.invoiceId) : (o.phone ? renderPhoneGate(deliveredFileUrl, o.phone, o.invoiceId) : renderReceiveButton(deliveredFileUrl, o.invoiceId))) : ''}
            </div>`;
    }

    // --- Phone verification gate -------------------------------------------------
    // Before the student can see the "استلام الطلب" button, they must type the phone
    // number that was registered on the order/invoice. This is a simple identity check
    // (not strong security — the correct number sits in a data-attribute in the page),
    // just enough to stop a random person who only guessed/shared the code from grabbing
    // someone else's file.
    function normalizePhone(p){ return (p || '').replace(/\D/g, ''); }
    function phonesMatch(entered, stored){
        const a = normalizePhone(entered), b = normalizePhone(stored);
        if (!a || !b) return false;
        if (a === b) return true;
        // Egyptian numbers are 11 digits (01xxxxxxxxx); compare the last 9 digits too
        // so a missing/extra leading 0 or country code (+20...) still matches.
        return a.slice(-9) === b.slice(-9);
    }

    // Renders the phone-check step. Once the entered phone matches, swaps itself for
    // the actual receive-order button.
    function renderPhoneGate(fileUrl, correctPhone, invoiceId){
        return `<div class="phone-gate" data-url="${escapeAttr(fileUrl)}" data-phone="${escapeAttr(correctPhone)}" data-invoice-id="${escapeAttr(invoiceId || '')}" style="margin-top:14px; display:flex; flex-direction:column; gap:8px; align-items:center;">
            <div style="font-size:13.5px; color:var(--ink-500,#666); text-align:center;">قبل ما تستلم طلبك، اكتب رقم الموبايل اللي سجّلت بيه الطلب</div>
            <div style="display:flex; gap:8px; width:100%; max-width:320px;">
                <input type="tel" class="phone-gate-input" placeholder="رقم الموبايل" style="flex:1; padding:10px 12px; border-radius:8px; border:1px solid #ccc; font-family:inherit;">
                <button type="button" class="telegram-btn phone-gate-btn" style="border:none; cursor:pointer; white-space:nowrap;">تأكيد</button>
            </div>
            <div class="phone-gate-error" style="color:#c0392b; font-size:12.5px; display:none;">الرقم مش مطابق للرقم المسجل بالطلب، جرب تاني.</div>
        </div>`;
    }

    function checkPhoneGate(gate){
        const input = gate.querySelector('.phone-gate-input');
        const errorEl = gate.querySelector('.phone-gate-error');
        const fileUrl = gate.getAttribute('data-url');
        const correctPhone = gate.getAttribute('data-phone');
        const invoiceId = gate.getAttribute('data-invoice-id');
        if (phonesMatch(input.value, correctPhone)){
            const wrapper = document.createElement('div');
            wrapper.innerHTML = renderReceiveButton(fileUrl, invoiceId);
            gate.replaceWith(wrapper.firstElementChild);
        } else {
            errorEl.style.display = 'block';
            input.focus();
        }
    }
    document.addEventListener('click', (e) => {
        const gateBtn = e.target.closest('.phone-gate-btn');
        if (!gateBtn) return;
        checkPhoneGate(gateBtn.closest('.phone-gate'));
    });
    document.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        const input = e.target.closest('.phone-gate-input');
        if (!input) return;
        e.preventDefault();
        checkPhoneGate(input.closest('.phone-gate'));
    });

    // Renders the "استلام الطلب" button. On click it swaps itself out for the actual
    // delivery link, so the link only appears once the student chooses to receive it.
    // The URL (and, if any, the linked invoice id) is kept in data-attributes rather
    // than inline JS so it's safe regardless of what characters the link contains.
    function renderReceiveButton(fileUrl, invoiceId){
        return `<button type="button" class="telegram-btn receive-order-btn" style="margin:14px auto 0; display:inline-flex; border:none; cursor:pointer;" data-url="${escapeAttr(fileUrl)}" data-invoice-id="${escapeAttr(invoiceId || '')}">📦 استلام الطلب</button>`;
    }
    // Event delegation: catches clicks on any receive-order button, now or added later.
    // Once the student actually receives the file, we also flip the linked invoice's
    // status to "تم التسليم" (delivered) automatically, so that shows up in the admin panel.
    document.addEventListener('click', (e) => {
        const btn = e.target.closest('.receive-order-btn');
        if (!btn) return;
        const fileUrl = btn.getAttribute('data-url');
        const invoiceId = btn.getAttribute('data-invoice-id');
        const link = document.createElement('a');
        link.className = 'telegram-btn';
        link.style.margin = '14px auto 0';
        link.style.display = 'inline-flex';
        link.href = fileUrl;
        link.target = '_blank';
        link.rel = 'noopener';
        link.textContent = '⬇️ تحميل ملف طلبك';
        btn.replaceWith(link);
        window.open(fileUrl, '_blank', 'noopener');
        if (invoiceId) markInvoiceDelivered(invoiceId);

        // Offer a quick path to rate the service right after the file is received
        const rateBtn = document.createElement('button');
        rateBtn.type = 'button';
        rateBtn.className = 'again-btn';
        rateBtn.style.margin = '14px 0 0';
        rateBtn.style.display = 'inline-flex';
        rateBtn.textContent = '⭐ قيّم خدمتنا';
        rateBtn.onclick = () => showView('rating');
        link.insertAdjacentElement('afterend', rateBtn);
    });

    // Marks the invoice as "delivered" the moment the student actually opens the file.
    async function markInvoiceDelivered(invoiceId){
        try{
            await db.collection('invoices').doc(invoiceId).update({ status: 'delivered' });
        }catch(e){ console.error(e); }
    }

    // Renders an invoice document (matched by its STP-2026-... code) into the result box.
    // Checks the invoice's own delivered-file link first; if that's empty but the invoice
    // is linked back to its original order (orderId), falls back to that order's link too —
    // so it doesn't matter which of the two places the admin set the link on.
    async function renderInvoiceResult(resultBox, inv, verified, allowReceive){
        const info = INVOICE_STATUS_INFO[inv.status] || { icon: '❔', label: inv.status || 'غير معروف', meta: '' };
        let deliveredFileUrl = inv.deliveredFileUrl || '';
        let orderPhone = '';
        if ((inv.status === 'finished' || inv.status === 'delivered') && inv.orderId && (!deliveredFileUrl || !inv.phone)){
            try{
                const orderDoc = await db.collection('orders').doc(inv.orderId).get();
                if (orderDoc.exists){
                    const orderData = orderDoc.data();
                    if (!deliveredFileUrl) deliveredFileUrl = orderData.deliveredFileUrl || '';
                    orderPhone = orderData.phone || '';
                }
            }catch(e){ console.error(e); }
        }
        const verifyPhone = inv.phone || orderPhone;
        // In pure "استعلام" (inquiry) mode allowReceive is false, so no receive/download
        // section shows at all — the student only sees the status stepper.
        const canDownload = allowReceive !== false && (inv.status === 'finished' || inv.status === 'delivered') && deliveredFileUrl;
        resultBox.innerHTML = `
            <div class="status-result ${escapeAttr(inv.status)}">
                <div class="s-icon">${info.icon}</div>
                <div class="s-label">${info.label}</div>
                ${renderStepper(INVOICE_STEPS, inv.status)}
                <div class="s-meta">${escapeAttr(inv.subject) || ''}${inv.subject ? ' — ' : ''}${info.meta}</div>
                ${canDownload ? (verified ? renderReceiveButton(deliveredFileUrl, inv.id) : (verifyPhone ? renderPhoneGate(deliveredFileUrl, verifyPhone, inv.id) : renderReceiveButton(deliveredFileUrl, inv.id))) : ''}
            </div>`;
    }

    async function findOrderByCode(code){
        const snap = await db.collection('orders').where('number', '==', code).limit(1).get();
        return snap.empty ? null : { id: snap.docs[0].id, ...snap.docs[0].data() };
    }

    async function findInvoiceByCode(code){
        const snap = await db.collection('invoices').where('number', '==', code).limit(1).get();
        return snap.empty ? null : { id: snap.docs[0].id, ...snap.docs[0].data() };
    }

    // --- Find all of a student's orders/invoices by phone number -------------------
    // Firestore can only match exact strings, so we try a couple of harmless variants
    // (with/without a leading 0) to cover the most common ways a number gets typed.
    function phoneVariants(phone){
        const digits = normalizePhone(phone);
        const variants = new Set([digits]);
        if (digits.length === 11 && digits.startsWith('0')) variants.add(digits.slice(1));
        if (digits.length === 10) variants.add('0' + digits);
        return [...variants].filter(Boolean);
    }

    async function findOrdersByPhone(phone){
        const found = new Map();
        for (const v of phoneVariants(phone)){
            const snap = await db.collection('orders').where('phone', '==', v).get();
            snap.docs.forEach(d => found.set(d.id, { id: d.id, kind: 'order', ...d.data() }));
        }
        return [...found.values()];
    }

    async function findInvoicesByPhone(phone){
        const found = new Map();
        for (const v of phoneVariants(phone)){
            const snap = await db.collection('invoices').where('phone', '==', v).get();
            snap.docs.forEach(d => found.set(d.id, { id: d.id, kind: 'invoice', ...d.data() }));
        }
        return [...found.values()];
    }

    function togglePhoneLookup(){
        const box = document.getElementById('phone-lookup-box');
        const showing = box.style.display !== 'none';
        box.style.display = showing ? 'none' : 'block';
        if (!showing) document.getElementById('lookup-phone').focus();
    }

    const PHONE_RESULT_ICONS = {
        new: '🆕', pending: '🔧', finished: '🎉', delivered: '📦'
    };

    // Shows only the invoices found for that phone number (never mixed with orders —
    // an invoice is the "official" record once an order gets accepted, so this is
    // what the student actually needs when they don't remember their code).
    function renderPhoneResultsList(resultBox, list){
        if (!list.length){
            resultBox.innerHTML = `
                <div class="status-result notfound">
                    <div class="s-icon">🔎</div>
                    <div class="s-label">مفيش فواتير بالرقم ده</div>
                    <div class="s-meta">اتأكد إنك كاتب نفس رقم التليفون اللي سجّلت بيه طلبك.</div>
                </div>`;
            return;
        }
        const items = list.map((r, i) => {
            const icon = PHONE_RESULT_ICONS[r.status] || '❔';
            return `
                <button type="button" class="phone-result-item" data-index="${i}">
                    <span class="pri-icon">${icon}</span>
                    <span class="pri-info">
                        <span class="pri-code">${escapeAttr(r.number)}</span>
                        <span class="pri-service">${escapeAttr(r.subject) || ''}</span>
                    </span>
                    <span class="pri-arrow">‹</span>
                </button>`;
        }).join('');
        resultBox.innerHTML = `
            <div class="phone-results">
                <div class="s-meta" style="margin-bottom:10px;">لقينا ${list.length} ${list.length === 1 ? 'فاتورة' : 'فواتير'} — دوس على أي كود عشان تشوف تفاصيله</div>
                ${items}
            </div>`;
        // Selecting one here means the phone number is already confirmed (that's how we
        // found it), so identity confirm goes straight to the result with the receive
        // option available — no extra phone-verify step needed.
        resultBox.querySelectorAll('.phone-result-item').forEach(item => {
            item.addEventListener('click', () => {
                const idx = Number(item.getAttribute('data-index'));
                const inv = list[idx];
                saveLastCode(inv.number);
                document.getElementById('phone-lookup-box').style.display = 'none';
                renderIdentityGate(resultBox, inv, 'invoice', { phoneAlreadyVerified: true });
            });
        });
    }

    async function lookupByPhone(){
        const raw = document.getElementById('lookup-phone').value.trim();
        const resultBox = document.getElementById('lookup-result');
        const btn = document.getElementById('lookup-phone-btn');
        if (!raw){ showToast('اكتب رقم التليفون الأول'); return; }

        btn.disabled = true; btn.textContent = 'جاري البحث...';
        resultBox.innerHTML = '';

        try{
            const invoices = await findInvoicesByPhone(raw);
            invoices.sort((a, b) => new Date(b.created || 0) - new Date(a.created || 0));
            renderPhoneResultsList(resultBox, invoices);
        }catch(err){
            console.error(err);
            resultBox.innerHTML = `
                <div class="status-result notfound">
                    <div class="s-icon">⚠️</div>
                    <div class="s-label">حصل خطأ أثناء البحث</div>
                    <div class="s-meta">جرب تاني بعد شوية.</div>
                </div>`;
        }
        btn.disabled = false; btn.textContent = 'بحث';
    }

    // --- Identity confirmation step ------------------------------------------------
    // Before showing the full order/invoice status (and definitely before any download
    // link), show only non-sensitive identity info (name / level / university — never
    // the phone number) and ask the student to confirm it's them. Once confirmed, they
    // verify by typing their phone number, then the real result renders.
    function renderIdentityGate(resultBox, record, kind, opts){
        opts = opts || {};
        // Order details shown live on either "service" (order) or "subject" (invoice)
        // for the requested service(s), and "description" (order) or "notes" (invoice)
        // for whatever extra details the student typed when registering the request.
        const serviceText = kind === 'invoice' ? (record.subject || '') : (record.service || '');
        const detailsText = kind === 'invoice' ? (record.notes || '') : (record.description || '');
        resultBox.innerHTML = `
            <div class="status-result identity-check">
                <div class="s-icon">🙋</div>
                <div class="s-label">دي بيانات صاحب الكود</div>
                <div class="s-meta" style="text-align:right; max-width:340px; margin:10px auto 16px;">
                    <div style="padding:6px 0; border-bottom:1px dashed var(--border);"><b>الاسم:</b> ${escapeAttr(record.name) || '—'}</div>
                    <div style="padding:6px 0; border-bottom:1px dashed var(--border);"><b>المرحلة الدراسية:</b> ${escapeAttr(record.level) || '—'}</div>
                    <div style="padding:6px 0; border-bottom:1px dashed var(--border);"><b>الجامعة:</b> ${escapeAttr(record.university) || '—'}</div>
                    <div style="padding:6px 0; border-bottom:1px dashed var(--border);"><b>الخدمة المطلوبة:</b> ${escapeAttr(serviceText) || '—'}</div>
                    <div style="padding:6px 0;"><b>تفاصيل الطلب:</b> ${escapeAttr(detailsText) || '—'}</div>
                </div>
                <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
                    <button type="button" class="telegram-btn identity-confirm-btn" style="border:none; cursor:pointer;">✅ ايوا دي بياناتي</button>
                    <button type="button" class="btn-secondary-light identity-deny-btn">مش أنا</button>
                </div>
            </div>`;
        resultBox.querySelector('.identity-confirm-btn').addEventListener('click', () => {
            if (opts.phoneAlreadyVerified){
                // Reached here by searching with a phone number — that phone number IS
                // the verification, so skip the extra phone-confirm step and go straight
                // to the result with the receive/download option available.
                if (kind === 'invoice') renderInvoiceResult(resultBox, record, true, true);
                else renderOrderResult(resultBox, record, true, true);
            } else if (lookupMode === 'receive'){
                // Receiving the file needs a phone check first, then the result renders
                // with the "استلام الطلب" button available.
                showPhoneVerifyStep(resultBox, record, kind);
            } else {
                // Just an inquiry — go straight to the status view, no phone check and
                // no receive/download option at all.
                if (kind === 'invoice') renderInvoiceResult(resultBox, record, false, false);
                else renderOrderResult(resultBox, record, false, false);
            }
        });
        resultBox.querySelector('.identity-deny-btn').addEventListener('click', () => {
            resultBox.innerHTML = '';
            const codeInput = document.getElementById('lookup-code');
            codeInput.value = '';
            codeInput.focus();
        });
    }

    // Works out which phone number to verify against: the record's own phone, or —
    // for invoices missing one — the phone on the order it was generated from.
    async function getVerifyPhone(record, kind){
        if (record.phone) return record.phone;
        if (kind === 'invoice' && record.orderId){
            try{
                const orderDoc = await db.collection('orders').doc(record.orderId).get();
                if (orderDoc.exists) return orderDoc.data().phone || '';
            }catch(e){ console.error(e); }
        }
        return '';
    }

    async function showPhoneVerifyStep(resultBox, record, kind){
        const verifyPhone = await getVerifyPhone(record, kind);
        // No phone on file to check against — just move on to the real result.
        if (!verifyPhone){
            if (kind === 'invoice') await renderInvoiceResult(resultBox, record, true, true);
            else await renderOrderResult(resultBox, record, true, true);
            return;
        }
        resultBox.innerHTML = `
            <div class="status-result identity-check">
                <div class="s-icon">📱</div>
                <div class="s-label">أكّد رقم تليفونك</div>
                <div class="s-meta">اكتب رقم الموبايل اللي سجّلت بيه الطلب عشان نتأكد إنك صاحب الكود</div>
                <div style="display:flex; gap:8px; width:100%; max-width:320px; margin:14px auto 0;">
                    <input type="tel" class="phone-gate-input" placeholder="رقم الموبايل" style="flex:1; padding:10px 12px; border-radius:8px; border:1px solid #ccc; font-family:inherit;">
                    <button type="button" class="telegram-btn verify-phone-btn" style="border:none; cursor:pointer; white-space:nowrap;">تأكيد</button>
                </div>
                <div class="phone-gate-error" style="color:#c0392b; font-size:12.5px; display:none; margin-top:8px;">الرقم مش مطابق للرقم المسجل، جرب تاني.</div>
            </div>`;
        const input = resultBox.querySelector('.phone-gate-input');
        const errorEl = resultBox.querySelector('.phone-gate-error');
        const confirm = async () => {
            if (phonesMatch(input.value, verifyPhone)){
                if (kind === 'invoice') await renderInvoiceResult(resultBox, record, true, true);
                else await renderOrderResult(resultBox, record, true, true);
            } else {
                errorEl.style.display = 'block';
                input.focus();
            }
        };
        resultBox.querySelector('.verify-phone-btn').addEventListener('click', confirm);
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter'){ e.preventDefault(); confirm(); } });
    }

    // Looks up either an order code (STU-P-...) or an auto-generated invoice code (STP-2026-...).
    // Tries the collection that matches the code's prefix first, then falls back to the other
    // collection so the student always gets a result even if they're not sure which kind of code they have.
    // Jumps from the "تم إرسال طلبك" success screen straight into the lookup view,
    // pre-filling the code the student just got and running the search right away.
    function goToLookupFromSuccess(){
        const code = document.getElementById('success-ref').textContent.trim();
        showView('lookup', 'inquiry');
        document.getElementById('lookup-code').value = code;
        if (code && code !== '#—') lookupOrder();
    }

    async function lookupOrder(){
        const raw = document.getElementById('lookup-code').value.trim();
        const resultBox = document.getElementById('lookup-result');
        const btn = document.getElementById('lookup-btn');
        if (!raw){ showToast('اكتب كود الطلب أو كود الفاتورة الأول'); return; }
        const code = raw.toUpperCase();
        const looksLikeInvoice = code.startsWith('STP-');

        btn.disabled = true; btn.textContent = 'جاري البحث...';
        resultBox.innerHTML = '';

        try{
            let order = null, invoice = null;
            if (looksLikeInvoice){
                invoice = await findInvoiceByCode(code);
                if (!invoice) order = await findOrderByCode(code);
            } else {
                order = await findOrderByCode(code);
                if (!order) invoice = await findInvoiceByCode(code);
            }

            if (invoice){
                saveLastCode(code);
                renderIdentityGate(resultBox, invoice, 'invoice');
            } else if (order){
                saveLastCode(code);
                renderIdentityGate(resultBox, order, 'order');
            } else {
                resultBox.innerHTML = `
                    <div class="status-result notfound">
                        <div class="s-icon">🔎</div>
                        <div class="s-label">مفيش طلب أو فاتورة بالكود ده</div>
                        <div class="s-meta">اتأكد إنك كتبت الكود صح زي ما وصلك بالظبط.</div>
                    </div>`;
            }
        }catch(err){
            console.error(err);
            resultBox.innerHTML = `
                <div class="status-result notfound">
                    <div class="s-icon">⚠️</div>
                    <div class="s-label">حصل خطأ أثناء البحث</div>
                    <div class="s-meta">جرب تاني بعد شوية.</div>
                </div>`;
        }
        btn.disabled = false; btn.textContent = 'بحث';
    }
    // Looks up an order by its STU-P-... code and shows its payment link (set by
    // the admin on the order itself, in the "رابط الدفع" field).
    async function lookupPaymentLink(){
        const raw = document.getElementById('payment-code').value.trim();
        const resultBox = document.getElementById('payment-result');
        const btn = document.getElementById('payment-btn');
        if (!raw){ showToast('اكتب كود الطلب الأول'); return; }
        const code = raw.toUpperCase();

        btn.disabled = true; btn.textContent = 'جاري البحث...';
        resultBox.innerHTML = '';

        try{
            const order = await findOrderByCode(code);
            if (!order){
                resultBox.innerHTML = `
                    <div class="status-result notfound">
                        <div class="s-icon">🔎</div>
                        <div class="s-label">مفيش طلب بالكود ده</div>
                        <div class="s-meta">اتأكد إنك كتبت كود الطلب صح زي ما وصلك بالظبط بعد التسجيل.</div>
                    </div>`;
            } else if (order.paymentLink){
                resultBox.innerHTML = `
                    <div class="status-result accepted">
                        <div class="s-icon">💳</div>
                        <div class="s-label">لينك الدفع جاهز</div>
                        <div class="s-meta">اضغط على الزرار عشان تكمل عملية الدفع.</div>
                        <div style="margin-top:14px;">
                            <a class="telegram-btn" style="display:inline-flex;" href="${escapeAttr(order.paymentLink)}" target="_blank" rel="noopener">💳 الدفع الآن</a>
                        </div>
                    </div>`;
            } else {
                resultBox.innerHTML = `
                    <div class="status-result waiting">
                        <div class="s-icon">⏳</div>
                        <div class="s-label">لينك الدفع لسه مش جاهز</div>
                        <div class="s-meta">هيتحط قريب، جرب تاني بعد شوية أو تواصل معانا.</div>
                    </div>`;
            }
        }catch(err){
            console.error(err);
            resultBox.innerHTML = `
                <div class="status-result notfound">
                    <div class="s-icon">⚠️</div>
                    <div class="s-label">حصل خطأ أثناء البحث</div>
                    <div class="s-meta">جرب تاني بعد شوية.</div>
                </div>`;
        }
        btn.disabled = false; btn.textContent = 'عرض';
    }
    document.getElementById('payment-code').addEventListener('keydown', (e) => {
        if (e.key === 'Enter'){ e.preventDefault(); lookupPaymentLink(); }
    });

    function escapeAttr(str){
        const div = document.createElement('div');
        div.textContent = str || '';
        return div.innerHTML;
    }
    document.getElementById('lookup-code').addEventListener('keydown', (e) => {
        if (e.key === 'Enter'){ e.preventDefault(); lookupOrder(); }
    });

    function resetForm(){
        document.getElementById('order-form').reset();
        syncContactPlaceholder();
        togglePaymentFields();
        updateTicket();
        document.getElementById('t-status').textContent = 'بتتملى دلوقتي';
        document.getElementById('t-status').classList.remove('sent');
        document.getElementById('t-num').textContent = '#—';
        document.getElementById('submit-btn').disabled = false;
        document.getElementById('submit-btn').textContent = 'إرسال الطلب';
    }

    // ---- Rating (student review) ----
    let selectedRating = 0;
    const starEls = Array.from(document.querySelectorAll('#star-picker .star'));
    function paintStars(value){
        starEls.forEach(s => {
            s.classList.toggle('filled', Number(s.dataset.value) <= value);
        });
    }
    starEls.forEach(s => {
        s.addEventListener('click', () => {
            selectedRating = Number(s.dataset.value);
            paintStars(selectedRating);
        });
        s.addEventListener('mouseenter', () => paintStars(Number(s.dataset.value)));
    });
    document.getElementById('star-picker').addEventListener('mouseleave', () => paintStars(selectedRating));

    // Highlight the chosen pill in each question's radio group
    document.querySelectorAll('.qr-group').forEach(group => {
        group.querySelectorAll('input[type="radio"]').forEach(input => {
            input.addEventListener('change', () => {
                group.querySelectorAll('.qr-option').forEach(opt => opt.classList.remove('checked'));
                input.closest('.qr-option').classList.add('checked');
            });
        });
    });

    function getRadioValue(name){
        const checked = document.querySelector(`input[name="${name}"]:checked`);
        return checked ? checked.value : '';
    }

    function resetRatingForm(){
        document.getElementById('rating-form').reset();
        selectedRating = 0;
        paintStars(0);
        document.querySelectorAll('.qr-option.checked').forEach(opt => opt.classList.remove('checked'));
        const btn = document.getElementById('rating-submit-btn');
        btn.disabled = false; btn.textContent = 'إرسال التقييم';
    }

    document.getElementById('rating-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const resultBox = document.getElementById('rating-result');
        resultBox.innerHTML = '';

        if (!selectedRating){
            showToast('من فضلك قيّم تجربتك الكلية بالنجوم الأول');
            return;
        }

        const q1 = getRadioValue('q1'), q2 = getRadioValue('q2'), q3 = getRadioValue('q3'),
              q4 = getRadioValue('q4'), q6 = getRadioValue('q6');
        if (!q1 || !q2 || !q3 || !q4 || !q6){
            showToast('من فضلك جاوب على كل الأسئلة');
            return;
        }

        const btn = document.getElementById('rating-submit-btn');
        btn.disabled = true; btn.textContent = 'جاري الإرسال...';

        const data = {
            stars: selectedRating,
            name: document.getElementById('r-name').value.trim(),
            q1, q2, q3, q4,
            q5: document.getElementById('r-q5').value.trim(),
            q6,
            visible: false,
            source: 'student-form',
            created: new Date().toISOString()
        };

        try{
            await db.collection('ratings').add(data);
            resultBox.innerHTML = `
                <div class="rating-result ok">
                    <div class="s-icon">✅</div>
                    <div class="s-label">شكراً لتقييمك الرائع!</div>
                    <div class="s-meta">لقد تم إرسال ملاحظاتك إلى الإدارة، وسنعمل على متابعة كل الملاحظات لضمان تقديم أفضل تجربة لكم، ورضاكم هو أولويتنا دائماً. نحن مستمرون بفضل دعمكم♥️🚀</div>
                </div>`;
            resetRatingForm();
        }catch(err){
            console.error(err);
            resultBox.innerHTML = `
                <div class="rating-result err">
                    <div class="s-icon">⚠️</div>
                    <div class="s-label">حصل خطأ أثناء الإرسال</div>
                    <div class="s-meta">جرب تاني بعد شوية.</div>
                </div>`;
            btn.disabled = false; btn.textContent = 'إرسال التقييم';
        }
    });

    // ---- Public reviews (only ratings the admin approved to show) ----
    // Reviews are grouped into boxes of up to 6; within each box you flip
    // between reviews with the arrows/dots or by swiping. When a 7th review
    // arrives a new box appears underneath, also capped at 6, and so on.
    function qaLine(label, val){
        if (!val) return '';
        return `
            <div class="pr-qa">
                <span class="pr-qa-label">${escapeAttr(label)}</span>
                <span class="pr-qa-val">${escapeAttr(val)}</span>
            </div>`;
    }

    function buildSlide(r, i){
        const stars = '★'.repeat(r.stars || 0) + '☆'.repeat(5 - (r.stars || 0));
        const name = r.name && r.name.trim() ? r.name.trim() : 'طالب StudyPro';
        return `
            <div class="pr-slide ${i === 0 ? 'active' : ''}">
                <div class="pr-slide-head">
                    <div class="pr-stars">${stars}</div>
                    <div class="pr-name">${escapeAttr(name)}</div>
                </div>
                <div class="pr-qa-list">
                    ${qaLine('جودة الشغل وهل جت زي المتوقع', r.q1)}
                    ${qaLine('الالتزام بالمواعيد', r.q2)}
                    ${qaLine('هل هيرشحنا لصحابه؟', r.q3)}
                    ${qaLine('أسلوب التعامل', r.q4)}
                    ${qaLine('اقتراح لتحسين التجربة', r.q5)}
                    ${qaLine('موافق على النشر في الاستوري بدون اسم؟', r.q6)}
                </div>
            </div>`;
    }

    function buildCarousel(group, gi){
        const slides = group.map((r, i) => buildSlide(r, i)).join('');
        return `
            <div class="pr-carousel" id="pr-carousel-${gi}" data-current="0">
                <div class="pr-counter" id="pr-counter-${gi}">1 / ${group.length}</div>
                ${group.length > 1 ? `<button type="button" class="pr-arrow prev" onclick="prStep(${gi}, -1)">‹</button><button type="button" class="pr-arrow next" onclick="prStep(${gi}, 1)">›</button>` : ''}
                <div class="pr-slides">${slides}</div>
                ${group.length > 1 ? `<div class="pr-dots">${group.map((_, i) => `<span class="pr-dot ${i === 0 ? 'active' : ''}" onclick="prGoTo(${gi}, ${i})"></span>`).join('')}</div>` : ''}
            </div>`;
    }

    function prGoTo(gi, idx){
        const wrap = document.getElementById('pr-carousel-' + gi);
        if (!wrap) return;
        const slides = wrap.querySelectorAll('.pr-slide');
        const dots = wrap.querySelectorAll('.pr-dot');
        slides.forEach((s, i) => s.classList.toggle('active', i === idx));
        dots.forEach((d, i) => d.classList.toggle('active', i === idx));
        wrap.dataset.current = idx;
        const counter = document.getElementById('pr-counter-' + gi);
        if (counter) counter.textContent = (idx + 1) + ' / ' + slides.length;
    }

    function prStep(gi, delta){
        const wrap = document.getElementById('pr-carousel-' + gi);
        if (!wrap) return;
        const total = wrap.querySelectorAll('.pr-slide').length;
        if (!total) return;
        let idx = Number(wrap.dataset.current || 0);
        idx = (idx + delta + total) % total;
        prGoTo(gi, idx);
    }

    function initCarouselSwipe(gi){
        const wrap = document.getElementById('pr-carousel-' + gi);
        if (!wrap) return;
        let startX = null;
        wrap.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
        wrap.addEventListener('touchend', e => {
            if (startX === null) return;
            const dx = e.changedTouches[0].clientX - startX;
            if (Math.abs(dx) > 40) prStep(gi, dx < 0 ? 1 : -1);
            startX = null;
        }, { passive: true });
    }

    function renderPublicReviews(list){
        const box = document.getElementById('public-reviews-list');
        if (!list.length){
            box.innerHTML = '<p class="pr-empty">لسه معندناش آراء منشورة، كن أول اللي يقيّم تجربته!</p>';
            return;
        }
        const groups = [];
        for (let i = 0; i < list.length; i += 6) groups.push(list.slice(i, i + 6));
        box.innerHTML = groups.map((g, gi) => buildCarousel(g, gi)).join('');
        groups.forEach((g, gi) => initCarouselSwipe(gi));
    }

    try{
        db.collection('ratings').where('visible', '==', true).onSnapshot(snap => {
            const list = snap.docs.map(d => d.data());
            list.sort((a, b) => new Date(b.created || 0) - new Date(a.created || 0));
            renderPublicReviews(list);
        }, err => {
            console.error('public reviews listener', err);
            document.getElementById('public-reviews-list').innerHTML = '';
        });
    }catch(err){ console.error(err); }

    // ---- Multi-step order form (wraps the existing fields; ids & submit logic unchanged) ----
    (function(){
        const form = document.getElementById('order-form');
        const f = id => document.getElementById(id);
        const fld = id => f(id).closest('.field');
        const rowOf = id => f(id).closest('.row2');
        const defs = [
            { t:'الخدمة', h:'اختار الخدمة المطلوبة', sub:'حدّد نوع الخدمة، ولو معاك كود خصم اكتبه.', nodes:[fld('f-service'), fld('f-promo')] },
            { t:'بياناتك', h:'بياناتك الشخصية', sub:'بنستخدمها للتواصل معاك بخصوص طلبك.', nodes:[rowOf('f-name'), rowOf('f-level'), fld('f-email')] },
            { t:'التفاصيل', h:'تفاصيل الطلب والدفع', sub:'اكتب تفاصيل طلبك واختار طريقة الدفع.', nodes:[fld('f-notes'), fld('f-payment'), f('wallet-field'), f('fawry-field')] },
            { t:'المراجعة', h:'راجع بياناتك وأرسل', sub:'اتأكد إن كل حاجة صح قبل الإرسال.', nodes:[] }
        ];
        const wiz = document.createElement('div'); wiz.className = 'wiz';
        wiz.innerHTML = defs.map((d, i) => (i ? '<div class="wiz-line"></div>' : '') + `<div class="wiz-s"><div class="wiz-dot">${i+1}</div><div class="wiz-l">${d.t}</div></div>`).join('');
        const steps = defs.map(d => {
            const el = document.createElement('div'); el.className = 'fstep';
            el.innerHTML = `<div class="fstep-title">${d.h}</div><div class="fstep-sub">${d.sub}</div>`;
            d.nodes.forEach(n => el.appendChild(n));
            return el;
        });
        const review = document.createElement('div'); review.className = 'review'; steps[3].appendChild(review);
        const submit = f('submit-btn');
        const nav = document.createElement('div'); nav.className = 'wiz-nav';
        nav.innerHTML = '<button type="button" class="btn-prev" id="wiz-prev">السابق</button><button type="button" class="submit-btn" id="wiz-next">التالي</button>';
        const back = form.querySelector('.back-link');
        back.after(wiz); steps.forEach(st => submit.before(st)); submit.before(nav);
        nav.appendChild(submit);
        let cur = 0;
        const val = id => { const e = f(id); return e ? e.value.trim() : ''; };
        const sel = id => { const e = f(id); return e && e.selectedIndex > 0 ? e.options[e.selectedIndex].text : ''; };
        function fill(){
            const rows = [['الخدمة', sel('f-service'), 0], ['كود الخصم', val('f-promo'), 0], ['الاسم', val('f-name'), 1], ['التليفون', val('f-phone'), 1], ['المرحلة', val('f-level'), 1], ['الجامعة', val('f-university'), 1], ['الإيميل', val('f-email'), 1], ['التفاصيل', val('f-notes'), 2], ['طريقة الدفع', sel('f-payment'), 2]];
            if (f('wallet-field').style.display !== 'none') rows.push(['رقم المحفظة', val('f-wallet-number'), 2]);
            if (f('fawry-field').style.display !== 'none') rows.push(['موبايل فوري', val('f-fawry-phone'), 2]);
            review.innerHTML = rows.filter(r => r[1]).map(r => `<div><span>${r[0]}</span><b>${escapeAttr(r[1])}</b><button type="button" class="edit" onclick="wizGo(${r[2]})">تعديل</button></div>`).join('');
        }
        function ok(i){
            const els = steps[i].querySelectorAll('input,select');
            for (const e of els){
                if (e.closest('[style*="display: none"], [style*="display:none"]')) continue;
                if (!e.checkValidity() || (e.type !== 'text' && e.type !== 'email' && e.type !== 'tel' && false)){ e.reportValidity(); return false; }
            }
            if (i === 1 && (!val('f-level') || !val('f-university'))){ showToast('اكتب المرحلة الدراسية والجامعة'); return false; }
            if (i === 2){
                if (f('wallet-field').style.display !== 'none' && !val('f-wallet-number')){ showToast('اكتب رقم المحفظة'); return false; }
                if (f('fawry-field').style.display !== 'none' && !val('f-fawry-phone')){ showToast('اكتب رقم موبايل فوري'); return false; }
            }
            return true;
        }
        function go(n){
            cur = n;
            steps.forEach((st, i) => st.classList.toggle('on', i === n));
            wiz.querySelectorAll('.wiz-s').forEach((e, i) => { e.classList.toggle('on', i === n); e.classList.toggle('done', i < n); e.querySelector('.wiz-dot').textContent = i < n ? '✓' : i + 1; });
            wiz.querySelectorAll('.wiz-line').forEach((e, i) => e.classList.toggle('done', i < n));
            f('wiz-prev').style.display = n ? 'block' : 'none';
            f('wiz-next').style.display = n === 3 ? 'none' : 'block';
            submit.style.display = n === 3 ? 'block' : 'none';
            if (n === 3) fill();
        }
        window.wizGo = go;
        f('wiz-prev').onclick = () => go(Math.max(0, cur - 1));
        f('wiz-next').onclick = () => { if (ok(cur)) go(cur + 1); };
        form.addEventListener('keydown', e => { if (e.key === 'Enter' && cur < 3 && e.target.tagName !== 'TEXTAREA'){ e.preventDefault(); f('wiz-next').click(); } });
        const rf = window.resetForm;
        window.resetForm = function(){ rf.apply(this, arguments); go(0); applyStudent(); };
        go(0);
    })();

    applyStudent();
    updateTicket();
    showView('landing');
    </script>
    </body>
    </html>

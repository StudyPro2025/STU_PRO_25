            radial-gradient(circle at 15% 8%, rgba(45,212,191,0.10), transparent 45%),
            radial-gradient(circle at 90% 85%, rgba(217,164,65,0.09), transparent 40%),
            var(--navy-950);
        background-attachment:fixed;
        color:var(--ink-900);
        min-height:100vh;
        display:flex;
        align-items:flex-start;
        justify-content:center;
        padding:48px 20px 80px;
    }
    .bg-grid{
        position:fixed; inset:0; pointer-events:none; z-index:0;
        background-image:
            linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
        background-size:34px 34px;
        mask-image:radial-gradient(circle at 50% 30%, black, transparent 75%);
    }
    .wrap{ position:relative; z-index:1; width:100%; max-width:1040px; }

    /* ---------- Header ---------- */
    .head{ text-align:center; margin-bottom:36px; animation:riseIn .6s ease both; }
    .brand{
        display:flex; flex-direction:column; align-items:center; gap:14px;
        margin-bottom:22px;
    }
    .brand .brand-logo{
        width:88px; height:88px; border-radius:22px; background:#fff; padding:12px;
        display:flex; align-items:center; justify-content:center; flex-shrink:0;
        box-shadow:0 16px 40px rgba(6,10,20,0.4), 0 0 0 1px rgba(255,255,255,0.06);
    }
    .brand .brand-logo img{ width:100%; height:100%; object-fit:contain; }
    .brand .brand-name{
        display:inline-flex; align-items:center; gap:8px;
        color:var(--teal-500); font-weight:800; font-size:15px; letter-spacing:1.5px;
    }
    .brand .brand-name .dot{ width:7px; height:7px; border-radius:50%; background:var(--teal-500); box-shadow:0 0 12px var(--teal-500); }
    .head h1{
        color:#fff; font-size:clamp(28px, 4.4vw, 42px); font-weight:800; line-height:1.25;
        margin-bottom:12px;
    }
    .head p{ color:var(--ink-400); font-size:15.5px; max-width:480px; margin:0 auto; line-height:1.8; }
    @media (max-width:520px){
        .brand .brand-logo{ width:72px; height:72px; border-radius:18px; padding:10px; }
    }

    /* ---------- Layout ---------- */
    .grid{
        display:grid; grid-template-columns:1.15fr 0.85fr; gap:26px; align-items:start;
        animation:riseIn .7s ease .05s both;
    }
    @media (max-width:860px){ .grid{ grid-template-columns:1fr; } }

    /* ---------- Form Card ---------- */
    .card{
        background:var(--surface); border-radius:20px; padding:34px 32px;
        box-shadow:0 20px 60px rgba(6,10,20,0.35);
    }
    .field{ margin-bottom:18px; }
    .field label{
        display:flex; align-items:baseline; gap:6px;
        font-size:13.5px; font-weight:700; color:var(--ink-700); margin-bottom:8px;
    }
    .field label .req{ color:var(--danger); font-weight:800; }
    .field label .opt{ color:var(--ink-400); font-weight:600; font-size:11.5px; }
    .field input, .field select{
        width:100%; padding:12px 14px; border-radius:11px; border:1.5px solid var(--border);
        background:var(--paper); font-family:var(--font-display); font-size:14.5px; color:var(--ink-900);
        transition:border-color .15s, background .15s, box-shadow .15s;
    }
    .field input::placeholder{ color:var(--ink-400); }
    .field input:focus, .field select:focus{
        outline:none; border-color:var(--teal-500); background:#fff;
        box-shadow:0 0 0 4px var(--teal-50);
    }
    .upload-box{
        width:100%; border:1.5px dashed var(--border); border-radius:11px; background:var(--paper);
        padding:16px; text-align:center; cursor:pointer; transition:border-color .15s, background .15s;
        position:relative;
    }
    .upload-box:hover{ border-color:var(--teal-500); background:var(--teal-50); }
    .upload-box input[type="file"]{
        position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%;
    }
    .upload-box .up-icon{ font-size:22px; margin-bottom:6px; }
    .upload-box .up-text{ font-size:12.5px; color:var(--ink-500); font-weight:700; }
    .upload-preview{ display:none; margin-top:12px; position:relative; }
    .upload-preview.show{ display:flex; align-items:center; gap:10px; background:var(--paper); border-radius:11px; padding:8px 10px; }
    .upload-preview img{ width:52px; height:52px; object-fit:cover; border-radius:8px; }
    .upload-preview .up-name{ flex:1; font-size:12px; color:var(--ink-700); font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .upload-preview .up-remove{
        background:none; border:none; color:var(--danger); font-size:16px; cursor:pointer; padding:4px; flex:0 0 auto;
    }
    .upload-progress{ display:none; margin-top:10px; height:6px; border-radius:6px; background:var(--paper); overflow:hidden; }
    .upload-progress.show{ display:block; }
    .upload-progress .bar{ height:100%; width:0%; background:var(--teal-500); transition:width .2s; }
    .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    @media (max-width:520px){ .row2{ grid-template-columns:1fr; } }

    .submit-btn{
        width:100%; margin-top:8px; padding:15px; border:none; border-radius:12px;
        background:linear-gradient(135deg, var(--teal-500), var(--teal-600));
        color:var(--navy-950); font-family:var(--font-display); font-weight:800; font-size:15.5px;
        cursor:pointer; transition:transform .15s, box-shadow .15s; box-shadow:0 10px 24px rgba(45,212,191,0.28);
    }
    .submit-btn:hover{ transform:translateY(-1px); box-shadow:0 14px 30px rgba(45,212,191,0.36); }
    .submit-btn:disabled{ opacity:.6; cursor:not-allowed; transform:none; }
    .hint{ text-align:center; color:var(--ink-500); font-size:12px; margin-top:12px; line-height:1.7; }

    /* ---------- Ticket preview (signature element) ---------- */
    .ticket-shell{ position:sticky; top:30px; }
    .ticket{
        position:relative; background:var(--paper); border-radius:18px; overflow:hidden;
        box-shadow:0 20px 60px rgba(6,10,20,0.35);
    }
    .ticket-top{
        background:var(--navy-900); color:#fff; padding:22px 24px 26px;
        display:flex; justify-content:space-between; align-items:flex-start;
    }
    .ticket-top .t-brand{ font-weight:800; font-size:16px; }
    .ticket-top .t-brand span{ color:var(--teal-500); }
    .ticket-top .t-sub{ color:var(--ink-400); font-size:11px; margin-top:3px; letter-spacing:.4px; }
    .ticket-num{ font-family:var(--font-mono); font-size:12px; color:var(--teal-500); text-align:left; }

    .perf{ position:relative; height:0; }
    .perf::before{
        content:""; position:absolute; inset-inline:0; top:-1px; height:2px;
        background-image:radial-gradient(circle, var(--navy-950) 2px, transparent 2.2px);
        background-size:14px 2px; background-repeat:repeat-x;
    }
    .perf .notch{ position:absolute; top:-13px; width:26px; height:26px; border-radius:50%; background:var(--navy-950); }
    .perf .notch.l{ left:-13px; } .perf .notch.r{ right:-13px; }

    .ticket-body{ padding:24px; }
    .t-row{ display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px dashed var(--border); }
    .t-row:last-child{ border-bottom:none; }
    .t-row .k{ font-size:12px; color:var(--ink-500); font-weight:600; white-space:nowrap; }
    .t-row .v{ font-size:13.5px; color:var(--ink-900); font-weight:700; text-align:left; word-break:break-word; }
    .t-row .v.empty{ color:var(--ink-400); font-weight:500; }
    .t-status{
        margin-top:16px; text-align:center; padding:10px; border-radius:10px;
        background:var(--amber-50); color:#8a6416; font-weight:800; font-size:12.5px; letter-spacing:.3px;
    }
    .t-status.sent{ background:var(--teal-50); color:#0d7d6e; }

    @keyframes riseIn{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:translateY(0); } }

    /* ---------- Success state ---------- */
    .success-screen{ display:none; text-align:center; animation:riseIn .5s ease both; }
    .success-screen.show{ display:block; }
    .success-screen .icon{
        width:74px; height:74px; border-radius:50%; margin:0 auto 20px;
        background:var(--teal-50); display:flex; align-items:center; justify-content:center; font-size:34px;
    }
    .success-screen h2{ color:#fff; font-size:24px; margin-bottom:10px; }
    .success-screen p{ color:var(--ink-400); font-size:14.5px; line-height:1.8; max-width:420px; margin:0 auto 26px; }
    .success-screen .ref{
        display:inline-block; font-family:var(--font-mono); background:var(--navy-800); color:var(--teal-500);
        padding:10px 18px; border-radius:10px; font-size:13.5px; margin-bottom:26px;
    }
    .again-btn{
        background:transparent; border:1.5px solid var(--navy-600); color:#fff; padding:11px 22px;
        border-radius:10px; font-family:var(--font-display); font-weight:700; font-size:13.5px; cursor:pointer;
    }
    .again-btn:hover{ border-color:var(--teal-500); color:var(--teal-500); }

    .btn-secondary-light{
        background:transparent; border:1.5px solid var(--border); color:var(--ink-700); padding:11px 22px;
        border-radius:10px; font-family:var(--font-display); font-weight:700; font-size:13.5px; cursor:pointer;
    }
    .btn-secondary-light:hover{ border-color:var(--teal-500); color:var(--teal-600); background:var(--teal-50); }

    .toast{
        position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
        background:var(--danger); color:#fff; padding:12px 22px; border-radius:10px; font-size:13.5px; font-weight:700;
        opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:50; box-shadow:0 10px 30px rgba(0,0,0,.3);
    }
    .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

    /* ---------- "Add to Home Screen" bar (mobile only) ---------- */
    .install-bar{
        display:none; align-items:center; gap:10px; max-width:1040px; margin:0 auto 18px;
        background:var(--surface); border-radius:14px; padding:12px 16px;
        box-shadow:0 10px 30px rgba(6,10,20,0.3); animation:riseIn .5s ease both;
    }
    .install-bar-icon{ font-size:20px; flex:0 0 auto; }
    .install-bar-text{ flex:1; font-size:12.5px; color:var(--ink-700); font-weight:700; line-height:1.5; }
    .install-bar-btn{
        flex:0 0 auto; border:none; border-radius:9px; background:linear-gradient(135deg, var(--teal-500), var(--teal-600));
        color:var(--navy-950); font-family:var(--font-display); font-weight:800; font-size:12.5px;
        padding:9px 16px; cursor:pointer; white-space:nowrap;
    }
    .install-bar-close{
        flex:0 0 auto; background:none; border:none; color:var(--ink-400); font-size:14px; cursor:pointer;
        padding:4px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    }
    .install-bar-close:hover{ color:var(--danger); }
    @media (max-width:600px){ .install-bar{ flex-wrap:wrap; } .install-bar-text{ flex-basis:100%; } }

    /* ---------- Install instructions modal ---------- */
    .install-modal-overlay{
        display:none; position:fixed; inset:0; background:rgba(6,10,20,0.55); z-index:80;
        align-items:center; justify-content:center; padding:20px;
    }
    .install-modal-overlay.show{ display:flex; }
    .install-modal{
        background:var(--surface); border-radius:18px; padding:26px 24px; max-width:360px; width:100%;
        text-align:center; box-shadow:0 24px 60px rgba(6,10,20,0.4); animation:riseIn .3s ease both;
    }
    .install-modal .im-icon{ font-size:30px; margin-bottom:8px; }
    .install-modal h3{ font-size:16px; color:var(--ink-900); margin-bottom:10px; }
    .install-modal p{ font-size:13.5px; color:var(--ink-700); line-height:1.9; margin-bottom:18px; }
    .install-modal button{ width:100%; }

    /* ---------- Landing (choose action) ---------- */
    .landing{ max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:16px; animation:riseIn .6s ease both; }
    .landing-btn{
        display:flex; align-items:center; gap:16px; width:100%; text-align:right;
        background:var(--surface); border:none; border-radius:16px; padding:22px 24px;
        cursor:pointer; box-shadow:0 14px 40px rgba(6,10,20,0.3); transition:transform .15s, box-shadow .15s;
        font-family:var(--font-display);
    }
    .landing-btn:hover{ transform:translateY(-2px); box-shadow:0 18px 46px rgba(6,10,20,0.36); }
    .landing-btn.primary{ background:linear-gradient(135deg, var(--teal-500), var(--teal-600)); }
    .landing-btn .lb-icon{ font-size:28px; flex:0 0 auto; }
    .landing-btn .lb-text{ display:flex; flex-direction:column; gap:4px; text-align:right; }
    .landing-btn .lb-text b{ font-size:16.5px; color:var(--ink-900); }
    .landing-btn.primary .lb-text b{ color:var(--navy-950); }
    .landing-btn .lb-text small{ font-size:12.5px; color:var(--ink-500); font-weight:600; }
    .landing-btn.primary .lb-text small{ color:rgba(12,21,38,0.65); }

    /* ---------- Back link ---------- */
    .back-link{
        display:inline-block; background:none; border:none; color:var(--ink-400); font-family:var(--font-display);
        font-weight:700; font-size:13px; cursor:pointer; margin-bottom:14px; padding:0;
    }
    .back-link:hover{ color:var(--teal-600); }

    /* ---------- Lookup ---------- */
    .lookup-card{
        max-width:480px; margin:0 auto; background:var(--surface); border-radius:20px; padding:32px;
        box-shadow:0 20px 60px rgba(6,10,20,0.35); animation:riseIn .6s ease both;
    }
    .lookup-card h2{ font-size:20px; color:var(--ink-900); margin-bottom:6px; }
    .lookup-card > p.sub{ color:var(--ink-500); font-size:13.5px; margin-bottom:20px; line-height:1.7; }
    .lookup-row{ display:flex; gap:10px; }
    .input-clear-wrap{ position:relative; flex:1; display:flex; }
    .input-clear-wrap input{
        flex:1; padding:12px 34px 12px 14px; border-radius:11px; border:1.5px solid var(--border);
        background:var(--paper); font-family:var(--font-mono); font-size:14px; letter-spacing:.5px; color:var(--ink-900);
    }
    .input-clear-wrap input:focus{ outline:none; border-color:var(--teal-500); background:#fff; box-shadow:0 0 0 4px var(--teal-50); }
    .input-clear-btn{
        position:absolute; left:6px; top:50%; transform:translateY(-50%);
        width:24px; height:24px; border:none; border-radius:50%; background:none; color:var(--ink-400);
        font-size:13px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
        transition:background .15s, color .15s;
    }
    .input-clear-btn:hover{ background:var(--paper); color:var(--danger); }

    /* ---------- Lookup: pick "استعلام" أو "استلام" inside the card ---------- */
    .mode-choice{ display:flex; flex-direction:column; gap:12px; margin-top:6px; }
    .mode-choice-btn{
        display:flex; align-items:center; gap:14px; width:100%; text-align:right;
        background:var(--paper); border:1.5px solid var(--border); border-radius:14px; padding:16px 18px;
        cursor:pointer; font-family:var(--font-display); transition:border-color .15s, background .15s;
    }
    .mode-choice-btn:hover{ border-color:var(--teal-500); background:var(--teal-50); }
    .mode-choice-btn .mc-icon{ font-size:24px; flex:0 0 auto; }
    .mode-choice-btn .mc-text{ flex:1; display:flex; flex-direction:column; gap:2px; }
    .mode-choice-btn .mc-text b{ font-size:14.5px; color:var(--ink-900); }
    .mode-choice-btn .mc-text small{ font-size:12px; color:var(--ink-500); font-weight:600; }
    .mode-choice-btn .mc-arrow{ font-size:20px; color:var(--ink-400); flex:0 0 auto; }
    .mode-back-link{
        display:inline-block; background:none; border:none; color:var(--ink-500); font-family:var(--font-display);
        font-weight:700; font-size:12.5px; cursor:pointer; margin-bottom:14px; padding:0; text-decoration:underline;
    }
    .mode-back-link:hover{ color:var(--teal-600); }
    .lookup-row button{
        padding:12px 20px; border:none; border-radius:11px; background:var(--navy-900); color:#fff;
        font-family:var(--font-display); font-weight:700; font-size:14px; cursor:pointer; white-space:nowrap;
    }
    .lookup-row button:hover{ background:var(--navy-800); }
    .lookup-row button:disabled{ opacity:.6; cursor:not-allowed; }

    .status-result{ margin-top:22px; padding:20px; border-radius:14px; text-align:center; animation:riseIn .35s ease both; }
    .status-result .s-icon{ font-size:32px; margin-bottom:8px; }
    .status-result .s-label{ font-weight:800; font-size:16px; margin-bottom:6px; color:var(--ink-900); }
    .status-result .s-meta{ font-size:12.5px; color:var(--ink-500); line-height:1.7; }
    .status-result.waiting{ background:var(--amber-50); }
    .status-result.accepted, .status-result.in_progress, .status-result.completed{ background:var(--teal-50); }
    .status-result.rejected, .status-result.cancelled{ background:#fdeaea; }
    .status-result.notfound{ background:var(--paper); }
    .status-result.new, .status-result.pending{ background:var(--amber-50); }
    .status-result.finished, .status-result.delivered{ background:var(--teal-50); }

    /* ---------- Phone lookup (find all my orders) ---------- */
    .phone-toggle-link{
        display:block; text-align:center; background:none; border:none; color:var(--ink-500); font-family:var(--font-display);
        font-weight:700; font-size:12.5px; cursor:pointer; margin-top:12px; padding:4px; text-decoration:underline;
    }
    .phone-toggle-link:hover{ color:var(--teal-600); }
    .phone-lookup-box{ margin-top:12px; }
    .phone-results{ margin-top:22px; text-align:right; animation:riseIn .35s ease both; }
    .phone-result-item{
        display:flex; align-items:center; gap:12px; width:100%; background:var(--paper); border:1.5px solid var(--border);
        border-radius:12px; padding:12px 14px; margin-bottom:10px; cursor:pointer; font-family:var(--font-display);
        text-align:right; transition:border-color .15s, background .15s;
    }
    .phone-result-item:hover{ border-color:var(--teal-500); background:var(--teal-50); }
    .phone-result-item .pri-icon{ font-size:20px; flex:0 0 auto; }
    .phone-result-item .pri-info{ flex:1; display:flex; flex-direction:column; gap:2px; overflow:hidden; }
    .phone-result-item .pri-code{ font-family:var(--font-mono); font-size:13px; font-weight:700; color:var(--ink-900); }
    .phone-result-item .pri-code small{ font-family:var(--font-display); color:var(--ink-500); font-weight:600; }
    .phone-result-item .pri-service{ font-size:12px; color:var(--ink-500); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .phone-result-item .pri-arrow{ font-size:20px; color:var(--ink-400); flex:0 0 auto; }

    /* ---------- Status stepper ---------- */
    .stepper{ display:flex; align-items:flex-start; justify-content:center; margin:16px 0 14px; direction:ltr; }
    .stepper-step{ display:flex; flex-direction:column; align-items:center; gap:6px; flex:0 0 auto; width:74px; }
    .stepper-dot{
        width:26px; height:26px; border-radius:50%; background:#fff; border:2px solid var(--border);
        color:var(--ink-400); font-size:11.5px; font-weight:800; display:flex; align-items:center; justify-content:center;
        transition:background .2s, border-color .2s, color .2s;
    }
    .stepper-step.done .stepper-dot{ background:var(--teal-500); border-color:var(--teal-500); color:#fff; }
    .stepper-step.active .stepper-dot{ border-color:var(--teal-500); color:var(--teal-600); box-shadow:0 0 0 4px var(--teal-50); }
    .stepper-label{ font-size:10.5px; color:var(--ink-500); font-weight:700; text-align:center; line-height:1.3; }
    .stepper-step.done .stepper-label, .stepper-step.active .stepper-label{ color:var(--ink-900); }
    .stepper-line{ flex:0 0 auto; width:26px; height:2px; background:var(--border); margin:12px -6px 0; }
    .stepper-line.done{ background:var(--teal-500); }
    .stepper-stopped{ margin:14px 0; padding:10px; border-radius:10px; background:rgba(214,69,69,0.08); }
    .stepper-stopped-msg{ font-size:12.5px; font-weight:800; color:var(--danger); }
    @media (max-width:420px){
        .stepper-step{ width:58px; }
        .stepper-label{ font-size:9.5px; }
        .stepper-line{ width:14px; }
    }

    /* ---------- Promo code (order form) ---------- */
    .promo-status{ font-size:12px; margin-top:6px; font-weight:700; display:none; }
    .promo-status.show{ display:block; }
    .promo-status.ok{ color:#0d7d6e; }
    .promo-status.bad{ color:var(--danger); }

    /* ---------- Copy code ---------- */
    .copy-row{ display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:26px; }
    .copy-btn{
        background:var(--navy-800); border:none; color:var(--teal-500); width:38px; height:38px; border-radius:10px;
        cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
        transition:background .15s, transform .15s;
    }
    .copy-btn:hover{ background:var(--navy-700); }
    .copy-btn.copied{ background:var(--teal-600); color:var(--navy-950); transform:scale(1.05); }
    .success-links{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
    .telegram-btn{
        display:flex; align-items:center; gap:8px; background:#26A5E4; border:1.5px solid #26A5E4; color:#fff;
        padding:11px 22px; border-radius:10px; font-family:var(--font-display); font-weight:700; font-size:13.5px;
        cursor:pointer; text-decoration:none;
    }
    .telegram-btn:hover{ background:#1e8fc7; border-color:#1e8fc7; }

    /* ---------- Rating (student review) ---------- */
    .rating-card{
        max-width:480px; margin:0 auto; background:var(--surface); border-radius:20px; padding:32px;

/* ===== StudyPro Design System v2 (tokens) ===== */
:root{
  --teal-500:#18C7B5; --teal-600:#12B3A3; --teal-700:#0F766E;
  --success:#22C55E; --warn:#F59E0B; --danger:#EF4444; --info:#3B82F6;
  --paper:#F6F8FB; --surface:#FFFFFF; --surface-2:#F1F5F9;
  --border:#E2E8F0; --border-strong:#CBD5E1;
  --ink-900:#172033; --ink-700:#334155; --ink-500:#64748B; --ink-400:#94A3B8;
  --teal-50:#E6F9F7; --amber-50:#FEF3C7; --danger-bg:#FEE2E2; --success-bg:#DCFCE7; --info-bg:#DBEAFE;
  --navy-950:#08111F; --navy-900:#0D1728; --navy-800:#111D2E; --navy-700:#162337; --navy-600:#24344A;
  --page-bg:#F6F8FB; --perf:#F6F8FB;
  --font-display:'Cairo','Tajawal',sans-serif;
}
:root[data-theme="dark"]{
  --paper:#08111F; --surface:#111D2E; --surface-2:#162337;
  --border:#24344A; --border-strong:#2F4260;
  --ink-900:#F5F7FA; --ink-700:#CBD5E1; --ink-500:#94A3B8; --ink-400:#64748B;
  --teal-50:rgba(24,199,181,.12); --amber-50:rgba(245,158,11,.14); --danger-bg:rgba(239,68,68,.15); --success-bg:rgba(34,197,94,.14); --info-bg:rgba(59,130,246,.15);
  --page-bg:#08111F; --perf:#08111F;
}
.theme-btn,.icon-btn.theme-3{ cursor:pointer; }

    :root{ --head-ink:var(--ink-900); --head-sub:var(--ink-500); --grid-line:rgba(100,116,139,.07); --shadow-c:0 8px 28px rgba(15,23,42,.08); }
    :root[data-theme="dark"]{ --grid-line:rgba(255,255,255,.03); --shadow-c:0 10px 34px rgba(0,0,0,.4); }
    body{ background:radial-gradient(circle at 15% 8%, rgba(45,212,191,.12), transparent 45%), radial-gradient(circle at 90% 85%, rgba(217,164,65,.10), transparent 40%), var(--page-bg); transition:background-color .2s; }
    .bg-grid{ background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px); }
    .head h1,.success-screen h2,.public-reviews h3{ color:var(--head-ink); }
    .head p,.success-screen p,.pr-empty{ color:var(--head-sub); }
    .card,.lookup-card,.rating-card,.ticket,.landing-btn,.install-bar,.pr-carousel{ box-shadow:var(--shadow-c); border:1px solid var(--border); }
    .landing-btn.primary{ border-color:transparent; }
    .landing-btn:hover{ border-color:var(--teal-500); }
    .field input:focus,.field select:focus,.input-clear-wrap input:focus,.rating-card textarea:focus{ background:var(--surface); }
    .again-btn{ color:var(--ink-900); border-color:var(--border); }
    .success-screen .ref,.copy-btn{ background:var(--surface); border:1px solid var(--border); }
    .stepper-dot{ background:var(--surface); }
    .status-result.rejected,.status-result.cancelled,.rating-result.err{ background:var(--danger-bg); }
    .perf::before{ background-image:radial-gradient(circle,var(--perf) 2px,transparent 2.2px); }
    .perf .notch{ background:var(--perf); }
    :root[data-theme="dark"] .lookup-row button{ background:var(--teal-600); color:var(--navy-950); }
    .topbar{ position:fixed; top:14px; left:14px; z-index:60; display:flex; gap:8px; align-items:center; }
    .theme-btn{ width:40px; height:40px; border-radius:12px; border:1px solid var(--border); background:var(--surface); box-shadow:var(--shadow-c); cursor:pointer; font-size:17px; }
    .user-chip{ display:none; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:5px 6px 5px 12px; font-size:12.5px; font-weight:700; color:var(--ink-700); box-shadow:var(--shadow-c); }
    .user-chip button{ border:none; background:var(--danger-bg); color:var(--danger); font-family:inherit; font-weight:800; font-size:12px; padding:7px 11px; border-radius:8px; cursor:pointer; }
    .auth-card{ max-width:440px; margin:0 auto; background:var(--surface); border:1px solid var(--border); border-radius:22px; padding:30px 28px; box-shadow:var(--shadow-c); animation:riseIn .6s ease both; }
    .auth-card .brand{ margin-bottom:14px; }
    .auth-card h2{ text-align:center; font-size:21px; color:var(--ink-900); margin-bottom:6px; }
    .auth-card .sub{ text-align:center; color:var(--ink-500); font-size:13px; line-height:1.8; margin-bottom:20px; }
    .auth-tabs{ display:grid; grid-template-columns:1fr 1fr; gap:4px; background:var(--paper); border-radius:12px; padding:4px; margin-bottom:18px; }
    .auth-tabs button{ border:none; background:none; padding:10px; border-radius:9px; font-family:inherit; font-weight:800; font-size:13.5px; color:var(--ink-500); cursor:pointer; }
    .auth-tabs button.active{ background:var(--surface); color:var(--teal-600); box-shadow:0 2px 8px rgba(0,0,0,.12); }
    .auth-error{ display:none; background:var(--danger-bg); color:var(--danger); font-size:12.5px; font-weight:700; padding:10px 12px; border-radius:10px; margin-bottom:14px; }
    .auth-error.show{ display:block; }
    .admin-link{ display:flex; justify-content:center; align-items:center; gap:6px; margin-top:20px; padding-top:16px; border-top:1px dashed var(--border); color:var(--ink-500); font-size:12.5px; font-weight:700; text-decoration:none; }
    .admin-link:hover{ color:var(--teal-600); }
    
    .brand .brand-name .dot{ box-shadow:none; }
    .submit-btn,.landing-btn.primary,.install-bar-btn{ background:var(--teal-500); color:#06231f; box-shadow:none; }
    .submit-btn:hover,.landing-btn.primary:hover,.install-bar-btn:hover{ background:var(--teal-600); box-shadow:none; }
    .landing-btn,.card,.lookup-card,.rating-card{ border-radius:16px; }
    .t-status{ color:var(--warn); } .t-status.sent{ color:var(--success); }
    .status-result.waiting,.status-result.new,.status-result.pending{ background:var(--amber-50); }
    
    /* ---- Student nav + dashboard ---- */
    .snav{ display:none; position:sticky; top:0; z-index:40; margin:-48px -20px 28px; padding:12px 20px; background:color-mix(in srgb,var(--paper) 88%,transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); }

    .dash{ margin-bottom:34px; animation:riseIn .5s ease both; }
    .dash h2{ font-size:22px; color:var(--ink-900); margin-bottom:4px; } .dash .dsub{ color:var(--ink-500); font-size:13.5px; margin-bottom:18px; }
    .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:22px; }
    @media (max-width:760px){ .stats{ grid-template-columns:1fr 1fr; } }
    .stat{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px; }
    .stat small{ display:flex; align-items:center; gap:7px; color:var(--ink-500); font-size:12.5px; font-weight:700; }
    .stat small i{ width:8px; height:8px; border-radius:50%; background:var(--teal-500); } .stat b{ display:block; font-size:24px; color:var(--ink-900); margin-top:6px; font-family:var(--font-mono); }
    .orders-box{ background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden; }
    .orders-head{ display:flex; justify-content:space-between; align-items:center; padding:16px 18px; border-bottom:1px solid var(--border); }
    .orders-head h3{ font-size:15.5px; color:var(--ink-900); }
    .btn-sm{ border:none; background:var(--teal-500); color:#06231f; font-family:inherit; font-weight:800; font-size:12.5px; padding:8px 14px; border-radius:9px; cursor:pointer; }
    .btn-sm:hover{ background:var(--teal-600); } .btn-sm.ghost{ background:var(--surface-2); color:var(--ink-700); }
    .otable{ width:100%; border-collapse:collapse; font-size:13px; }
    .otable th{ text-align:right; padding:10px 16px; color:var(--ink-500); font-size:12px; background:var(--surface-2); font-weight:700; }
    .otable td{ padding:13px 16px; border-top:1px solid var(--border); color:var(--ink-900); }
    .otable .code{ font-family:var(--font-mono); font-size:12.5px; }
    .badge{ display:inline-block; padding:4px 10px; border-radius:20px; font-size:12px; font-weight:800; white-space:nowrap; }
    .b-warn{ background:var(--amber-50); color:var(--warn); } .b-info{ background:var(--info-bg); color:var(--info); }
    .b-ok{ background:var(--success-bg); color:var(--success); } .b-bad{ background:var(--danger-bg); color:var(--danger); } .b-mute{ background:var(--surface-2); color:var(--ink-500); }
    .empty{ text-align:center; padding:38px 20px; } .empty b{ display:block; color:var(--ink-900); margin-bottom:4px; } .empty p{ color:var(--ink-500); font-size:13px; margin-bottom:14px; }
    .skel{ height:46px; margin:10px 16px; border-radius:10px; background:linear-gradient(90deg,var(--surface-2),var(--border),var(--surface-2)); background-size:200% 100%; animation:sk 1.2s linear infinite; }

    @media (max-width:640px){

    /* ---- Multi-step order form ---- */
    .wiz{ display:flex; align-items:center; margin:2px 0 22px; }
    .wiz-s{ display:flex; flex-direction:column; align-items:center; gap:6px; flex:0 0 auto; width:64px; }
    .wiz-dot{ width:30px; height:30px; border-radius:50%; border:2px solid var(--border); background:var(--surface); color:var(--ink-400); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; transition:.2s; }
    .wiz-l{ font-size:11px; font-weight:700; color:var(--ink-500); text-align:center; }

    .review .edit{ color:var(--teal-600); background:none; border:none; font-family:inherit; font-weight:800; font-size:12px; cursor:pointer; }
    
    .ov{ display:none; position:fixed; inset:0; background:rgba(2,8,20,.55); z-index:90; justify-content:center; align-items:flex-start; padding:30px 16px; overflow:auto; }

    .pane{ background:var(--surface); border:1px solid var(--border); border-radius:18px; width:100%; max-width:520px; padding:24px; box-shadow:var(--shadow-c); animation:riseIn .3s ease both; }

    .tl{ margin:16px 0; padding-right:4px; } .tl-i{ position:relative; display:flex; gap:12px; padding-bottom:18px; }

    .tl-d{ width:22px; height:22px; border-radius:50%; border:2px solid var(--border); background:var(--surface); flex:0 0 auto; z-index:1; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:#06231f; }

    .pane .btn-sm{ padding:11px 16px; } .pane-act{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }

    // ---- Force English digits only (no Arabic/Persian numerals) ----
    // Converts ٠-٩ (Arabic-Indic) and ۰-۹ (Eastern Arabic-Indic/Persian) to 0-9 live as the
    // student types. On pure-number fields (phone, wallet, fawry) any non-digit character
    // typed is also stripped; on code fields (order/invoice codes) only the digits are
    // converted so letters/dashes in the code still work normally.
    const ARABIC_INDIC = '٠١٢٣٤٥٦٧٨٩';
    const EASTERN_ARABIC_INDIC = '۰۱۲۳۴۵۶۷۸۹';
    function toEnglishDigits(str){
        if (!str) return str;
        return str.replace(/[٠-٩۰-۹]/g, (d) => {
            let idx = ARABIC_INDIC.indexOf(d);
            if (idx === -1) idx = EASTERN_ARABIC_INDIC.indexOf(d);
            return idx === -1 ? d : String(idx);
        });
    }
    document.addEventListener('input', (e) => {
        const el = e.target;
        if (el.matches && el.matches('#f-phone, #f-wallet-number, #f-fawry-phone, .phone-gate-input')){
            const converted = toEnglishDigits(el.value).replace(/[^0-9]/g, '');
            if (converted !== el.value){
                const pos = el.selectionStart;
                el.value = converted;
                if (pos !== null) el.setSelectionRange(converted.length, converted.length);
            }
        } else if (el.matches && el.matches('#lookup-code, #payment-code')){
            const converted = toEnglishDigits(el.value);
            if (converted !== el.value) el.value = converted;
        }
    });

    // Clears a text input (used by the small ✕ button inside the lookup/payment code fields).

    // ---- "ثبّت الموقع على شاشتك الرئيسية" (Add to Home Screen) --------------------
    // The <head> now ships a real web app manifest (embedded as a data: URI, since this
    // is a single-file page) with icons + standalone display, so Chrome/Edge/Android now
    // actually satisfy the installability criteria and fire beforeinstallprompt for real.
    // On Android/Chrome we grab that native install prompt when the browser offers it,
    // and everywhere else (always on iOS, and as a fallback if no prompt fires) we show a
    // short "how to" popup with the manual steps — the most a plain webpage can do there.
    let deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredInstallPrompt = e;
        maybeShowInstallBar();
    });
    window.addEventListener('appinstalled', () => {
        deferredInstallPrompt = null;
        dismissInstallBar();
    });

    function isStandaloneMode(){
        return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    }
    function isMobileDevice(){
        return /iphone|ipad|ipod|android/i.test(navigator.userAgent);
    }
    function installDismissedBefore(){
        try{ return localStorage.getItem('studypro_install_dismissed') === '1'; }catch(e){ return false; }
    }

    // Only bother showing the bar on phones that aren't already running the site
    // as an installed app, and not if the student already closed it once before.
    function maybeShowInstallBar(){
        if (isStandaloneMode() || !isMobileDevice() || installDismissedBefore()) return;
        const bar = document.getElementById('install-bar');
        if (bar) bar.style.display = 'flex';
    }

    function dismissInstallBar(){
        const bar = document.getElementById('install-bar');
        if (bar) bar.style.display = 'none';
        try{ localStorage.setItem('studypro_install_dismissed', '1'); }catch(e){}
    }

    async function handleInstallClick(){
        if (deferredInstallPrompt){
            deferredInstallPrompt.prompt();
            try{ await deferredInstallPrompt.userChoice; }catch(e){}
            deferredInstallPrompt = null;
            dismissInstallBar();
            return;
        }
        showInstallInstructions();
    }

    function showInstallInstructions(){
        const ua = navigator.userAgent || '';
        const isIOS = /iphone|ipad|ipod/i.test(ua);

            : 'دوس على الثلاث نقط (⋮) فوق يمين المتصفح، وبعدين دوس على "إضافة إلى الشاشة الرئيسية" أو "تثبيت التطبيق".';
        document.getElementById('install-modal-overlay').classList.add('show');
    }

        document.getElementById('install-modal-overlay').classList.remove('show');

    maybeShowInstallBar();

    async function sha256(str){
        if (!window.crypto || !crypto.subtle) throw new Error('nosubtle');
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // بيولّد رقم تسلسلي فريد باستخدام Firestore transaction، عشان لو طالبين بعتوا طلب في نفس اللحظة
    // ما ياخدوش نفس الرقم (بدل الاعتماد على عدد الطلبات اللي ممكن يتقرأ قبل ما يتزامن)
    async function nextSequentialNumber(prefix, counterId){
        const counterRef = db.collection('counters').doc(counterId);
        try{
            const newCount = await db.runTransaction(async (transaction) => {
                const doc = await transaction.get(counterRef);
                if (doc.exists) {
                    const next = (doc.data().count || 0) + 1;
                    transaction.set(counterRef, { count: next }, { merge: true });
                    return next;
                }
                return null; // العداد لسه معملوش؛ هنظبطه تحت أول مرة بس
            });
            if (newCount !== null) return prefix + String(newCount).padStart(4, '0');
        }catch(e){ /* هنكمل على الخطة البديلة تحت */ }

        // أول مرة بس: بنجيب أعلى رقم موجود فعليًا في الطلبات عشان منكررش أرقام قديمة
        try{
            const snap = await db.collection('orders')
                .where('number', '>=', prefix).where('number', '<', prefix + '\uf8ff').get();
            let max = 0;
            snap.forEach(doc => {
                const n = parseInt(String(doc.data().number || '').slice(prefix.length), 10);
                if (!isNaN(n) && n > max) max = n;
            });
            const next = max + 1;
            await counterRef.set({ count: next }, { merge: true });
            return prefix + String(next).padStart(4, '0');
        }catch(e2){
            return prefix + Date.now().toString().slice(-6);
        }
    }
